<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https: http:; object-src 'none'; base-uri 'none'">
  <title>书签小屋 · 留住每次好发现</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="manager.css">
  <link rel="stylesheet" href="analytics.css">
  <link rel="stylesheet" href="organizer.css">
  <link rel="stylesheet" href="web-collection.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidebar-layout.css">
  <link rel="stylesheet" href="library-tools.css">
  <link rel="stylesheet" href="bookmark-cards.css">
  <script type="module" src="manager-start.js"></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M10 21v-7h4v7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5zM20 2v4M18 4h4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 5h7l2 3h9v12H3z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7a9 9 0 1 0 1 8M20 2v6h-6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v18h17M8 16v-5M13 16V6M18 16V9"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4M8 16l-2 2a4.3 4.3 0 0 1-6-6l4-4a4.3 4.3 0 0 1 6 0M16 8l2-2a4.3 4.3 0 0 1 6 6l-4 4a4.3 4.3 0 0 1-6 0" transform="translate(1 0) scale(.92)"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.5l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </defs></svg>
  <aside class="sidebar" id="appSidebar" aria-label="小屋导航">
    <div class="brand"><div class="brand-mark"><svg class="icon"><use href="#i-home"/></svg></div><div><strong>书签小屋</strong><span>BOOKMARK HOUSE</span></div></div>
    <div class="sidebar-scroll">
    <nav class="sidebar-primary" aria-label="网页收藏"><div class="nav-label">我的收藏</div><button data-view="web" data-web-nav="all" class="nav-item active"><svg class="icon"><use href="#i-grid"/></svg><span>网页收藏</span><b id="navWeb">—</b></button><button data-web-nav="starred" class="nav-item"><svg class="icon"><use href="#i-star"/></svg><span>星标收藏</span><b id="navWebStarred">—</b></button></nav>
    <details class="bookmark-section" id="bookmarkSection"><summary><svg class="icon"><use href="#i-book"/></svg><span>书签库</span><svg class="icon section-chevron"><use href="#i-chevron"/></svg></summary><div class="bookmark-details-body">
    <div class="folder-heading"><span class="nav-label">书签文件夹</span><span class="folder-drop-hint">可拖入链接</span><button class="icon-button" data-action="newFolder" title="新建文件夹" aria-label="新建文件夹"><svg class="icon"><use href="#i-plus"/></svg></button></div>
    <div id="folders" class="folder-tree" role="region" aria-label="书签文件夹目录"></div>
    <nav class="bookmark-shortcuts" aria-label="书签库视图">
      <button data-view="all" class="nav-item"><svg class="icon"><use href="#i-grid"/></svg><span>所有书签</span><b id="navAll">—</b></button>
      <button data-view="recent" class="nav-item"><svg class="icon"><use href="#i-clock"/></svg><span>最近添加</span></button>
    </nav>
    </div></details>
    <nav id="navigation" class="sidebar-tools" aria-label="共用收藏工具">
      <div class="nav-label">收藏工具</div>
      <button data-view="analysis" class="nav-item"><svg class="icon"><use href="#i-chart"/></svg><span>内容分析</span></button>
      <button data-view="organize" class="nav-item"><svg class="icon"><use href="#i-spark"/></svg><span>整理中心</span></button>
      <button data-view="trash" class="nav-item"><svg class="icon"><use href="#i-trash"/></svg><span>回收站</span><b id="navTrash">—</b></button>
      <button data-view="backup" class="nav-item"><svg class="icon"><use href="#i-down"/></svg><span>备份与导入</span></button>
    </nav>
    </div>
    <div class="sidebar-footer"><svg class="icon"><use href="#i-book"/></svg><div>留住好内容<span>随时回来看看</span></div><small>v2.4.7</small></div>
  </aside>
  <div id="sidebarResize" class="sidebar-resize" role="separator" tabindex="0" aria-label="调整侧边栏宽度" aria-orientation="vertical" aria-controls="appSidebar" aria-valuemin="220" aria-valuemax="480" aria-valuenow="244" title="拖拽调整宽度 · 双击恢复默认 · 方向键微调"></div>
  <button id="sidebarBackdrop" class="sidebar-backdrop" aria-label="收起导航" tabindex="-1"></button>
  <div class="workspace">
    <header class="topbar">
      <button id="mobileMenu" class="icon-button" aria-label="收起侧边栏" aria-controls="appSidebar" aria-expanded="true" title="收起侧边栏"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="breadcrumb">个人空间 <span>/</span> <strong id="breadcrumbTitle">网页收藏</strong></div>
      <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索收藏、文件夹或正文…" aria-label="搜索书签"><kbd>Ctrl K</kbd></label>
      <span class="local-badge"><span></span>本地保存</span>
    </header>
    <main>
      <div id="demoBanner" class="demo-banner" hidden><span>你正在预览示例收藏。安装扩展后，这里会显示你自己保存的内容。</span><span><button class="text-button" data-action="resetDemo">重置示例</button>　<a href="安装与使用.html" target="_blank" rel="noopener">查看安装方法 →</a></span></div>
      <section class="page-heading"><div><div class="eyebrow" id="pageEyebrow">YOUR LIBRARY</div><h1 id="pageTitle">网页收藏</h1><p id="pageDescription">值得再看的，都在这里。</p></div><div class="heading-actions" id="bookmarkHeadingActions" hidden><button class="button secondary" data-action="backup"><svg class="icon"><use href="#i-down"/></svg><span id="headingBackupLabel">备份书签</span></button><button class="button primary" data-action="organizeCurrent" id="headingOrganize"><svg class="icon"><use href="#i-spark"/></svg><span id="headingOrganizeLabel">开始整理</span></button></div><div class="heading-actions web-heading-actions" id="webHeadingActions"><button class="text-button" data-action="webImport">导入</button><button class="button secondary" data-action="webExport"><svg class="icon"><use href="#i-down"/></svg>导出</button><button class="button primary" data-action="webAdd"><svg class="icon"><use href="#i-plus"/></svg>保存网页</button></div></section>
      <section id="toolSourceBar" aria-label="处理来源" hidden></section>
      <section id="backupPanel" aria-label="备份与导入" hidden></section>
      <section id="webPanel" aria-label="网页卡片收藏"><div class="web-empty">正在打开你的网页收藏…</div></section>
      <div class="trash-toolbar"><button id="emptyTrashButton" class="button danger" data-action="emptyTrash" hidden><svg class="icon"><use href="#i-trash"/></svg>一键清空回收站</button></div>
      <section class="stats" aria-label="书签概况" hidden>
        <button class="stat-card" data-action="statScope" data-id="total"><span><span id="statTotalLabel">全部收藏</span><svg class="icon"><use href="#i-book"/></svg></span><strong id="statTotal">—</strong><small id="statTotalHint">那些不想错过的好内容</small></button>
        <button class="stat-card" data-action="statScope" data-id="folders"><span><span id="statFoldersLabel">文件夹</span><svg class="icon"><use href="#i-folder"/></svg></span><strong id="statFolders">—</strong><small id="statFoldersHint">为不同兴趣留个位置</small></button>
        <button class="stat-card accent" data-action="statScope" data-id="duplicates"><span><span id="statDuplicatesLabel">可精简重复</span><svg class="icon"><use href="#i-copy"/></svg></span><strong id="statDuplicates">—</strong><small id="statDuplicatesHint">每个网址至少保留一份</small></button>
        <button class="stat-card" data-action="statScope" data-id="direct"><span><span id="statLooseLabel">待归类</span><svg class="icon"><use href="#i-spark"/></svg></span><strong id="statLoose">—</strong><small id="statLooseHint">还散落在顶层的书签</small></button>
      </section>
      <section id="analysisPanel" hidden aria-label="书签内容分析"></section>
      <section id="organizerPanel" aria-label="自动整理工作台" hidden></section>
      <section class="collection-panel bookmark-library" hidden>
        <div class="collection-top"><div><h2 id="listTitle">收藏清单</h2><span id="listCount" class="count-badge">0</span></div><div class="list-controls"><button class="text-button" data-action="undo" id="undoButton" disabled><svg class="icon"><use href="#i-undo"/></svg>撤销上次操作</button><button class="icon-button" data-action="refresh" title="刷新书签" aria-label="刷新书签"><svg class="icon"><use href="#i-refresh"/></svg></button><select id="sort" aria-label="书签排序"><option value="recent">最近收藏优先</option><option value="title">按名称排序</option><option value="domain">按网站排序</option></select></div></div>
        <div id="contextBar" class="context-bar" hidden></div>
        <div id="bulkbar" class="bulkbar" hidden><span>已选择 <strong id="selectedCount">0</strong> 项</span><button class="text-button" data-action="selectAllResults">选择全部结果</button><div class="bulk-actions"><button class="button small secondary" data-action="move">移动到文件夹</button><button class="button small primary" data-action="categorize" id="applyCategory">应用分类</button><button class="button small danger-quiet" data-action="archive" id="archiveButton">移入回收站</button><button class="button small primary" data-action="restore" id="restoreButton" hidden>还原所选</button><button class="icon-button" data-action="clearSelection" aria-label="取消选择">×</button></div></div>
        <div id="list" class="list-wrap" aria-live="polite"><div class="empty-state">正在打开你的小屋…</div></div>
        <footer class="list-footer"><span id="resultDescription">正在读取书签</span><div class="pagination"><button class="text-button" data-action="previous" id="previousPage">← 上一页</button><span id="pageNumber">1 / 1</span><button class="text-button" data-action="next" id="nextPage">下一页 →</button></div></footer>
      </section>
      <div class="bottom-note" hidden><span><svg class="icon"><use href="#i-shield"/></svg>整理前自动保留一份本地备份，删除先移入回收站。</span><button class="text-button" data-action="exportBefore">导出操作前备份 <span>↗</span></button></div>
      <p class="privacy-note"><a href="privacy.html" target="_blank" rel="noopener noreferrer">隐私说明</a></p><div id="status" class="status" role="status"></div>
    </main>
  </div>
  <div id="folderMenu" class="folder-menu" role="menu" aria-label="文件夹操作" tabindex="-1" hidden><button id="folderDeleteMenu" role="menuitem" data-action="archiveFolder"><svg class="icon"><use href="#i-trash"/></svg>删除文件夹</button><p id="folderMenuNote" class="folder-menu-note" hidden></p></div>
  <dialog id="dialog" aria-labelledby="dialogTitle"><form id="dialogForm"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button class="icon-button" type="button" id="dialogCancelX" aria-label="关闭">×</button></div><div id="dialogBody"></div><p id="dialogError" class="form-error" role="alert"></p><div class="dialog-footer"><button class="button secondary" type="button" id="dialogCancel">取消</button><button class="button primary" id="dialogConfirm" type="submit">确认</button></div></form></dialog>
  <div id="toast" role="status" hidden><span id="toastMessage"></span><button id="toastUndo" class="text-button">撤销</button><button id="toastClose" class="icon-button" aria-label="关闭提示">×</button></div>
  <div id="dragStatus" role="status" aria-live="polite" hidden></div>
</body>
</html>
